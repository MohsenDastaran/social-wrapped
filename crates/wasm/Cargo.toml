[package]
name = "social-wrapped-wasm"
version.workspace = true
edition.workspace = true
description = "WASM bindings for social-wrapped"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app-core = { path = "../core", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Response", "Request", "RequestInit"] }
