[package]
name = "app-core"
version.workspace = true
edition.workspace = true
description = "Platform-agnostic analytics core for social media data exports"

[features]
# DuckDB compiles ~300 MB of C++ from source (features = ["bundled"]) and can
# freeze low-RAM machines. Keep storage/analytics opt-in — enable only when
# you need OLAP queries: cargo build --features analytics
default = []
storage = ["dep:duckdb"]
analytics = ["storage", "parallel"]
parallel = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
rayon = { version = "1", optional = true }
duckdb = { version = "1", features = ["bundled"], optional = true }

[dev-dependencies]
