# Build installers and attach them to the GitHub Release.
#
# Trigger: publish a Release on GitHub (or run manually via Actions → Release).
# Assets (sorted alphabetically via numeric prefixes):
#   01 APK (arm64 then universal) → 02 Windows → 03 macOS → 04 deb → 05 rpm → 06 AppImage

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Prefer arm64-v8a for real phones (smaller + correct ABI).
          - platform: ubuntu-22.04
            args: --apk --target aarch64
            mobile: android
            rust_targets: aarch64-linux-android,wasm32-unknown-unknown
          # Universal APK (all ABIs) for emulators / unusual devices.
          - platform: ubuntu-22.04
            args: --apk
            mobile: android
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
          - platform: windows-latest
            args: ''
            mobile: ''
            rust_targets: wasm32-unknown-unknown
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            mobile: ''
            rust_targets: aarch64-apple-darwin,wasm32-unknown-unknown
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            mobile: ''
            rust_targets: x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ''
            mobile: ''
            rust_targets: wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools
        if: matrix.mobile == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "Using ANDROID_KEY_* secrets for release signing."
          else
            # Committed sideload keystore — APKs install and update across releases.
            # Override with ANDROID_KEY_* secrets for Play Store / private keys.
            echo "keyAlias=upload" > keystore.properties
            echo "password=social-wrapped-release" >> keystore.properties
            echo "storeFile=$PWD/ci-release.jks" >> keystore.properties
            echo "Using committed ci-release.jks for sideload signing."
          fi

      - name: Install wasm-pack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-pack

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.mobile || 'desktop' }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          # Attach bundles to the Release that triggered this workflow.
          # Empty on workflow_dispatch → build only (no upload).
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}

  # GitHub lists release assets alphabetically — rename with sort prefixes.
  order-assets:
    needs: build-tauri
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Prefix asset names for display order
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = context.payload.release.id
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            })

            function sortPrefix(name) {
              const bare = name.replace(/^\d{2}[a-z]?-/, '').replace(/\.sig$/i, '').toLowerCase()
              if (bare.endsWith('.apk') || bare.endsWith('.aab')) {
                if (
                  bare.includes('arm64') ||
                  bare.includes('aarch64') ||
                  bare.includes('arm64-v8a')
                )
                  return '01a'
                return '01b'
              }
              if (bare.endsWith('.msi') || bare.endsWith('.exe')) return '02'
              if (
                bare.endsWith('.dmg') ||
                bare.endsWith('.app') ||
                bare.includes('.app.tar')
              )
                return '03'
              if (bare.endsWith('.deb')) return '04'
              if (bare.endsWith('.rpm')) return '05'
              if (bare.endsWith('.appimage')) return '06'
              return '99'
            }

            for (const asset of assets) {
              const base = asset.name.replace(/^\d{2}[a-z]?-/, '')
              const next = `${sortPrefix(asset.name)}-${base}`
              if (next === asset.name) continue
              core.info(`${asset.name} → ${next}`)
              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                name: next,
              })
            }
