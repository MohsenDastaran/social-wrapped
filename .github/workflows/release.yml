# Build installers and attach them to the GitHub Release.
#
# Trigger:
#   - Publish a GitHub Release (release published), or
#   - Actions → Release → Run workflow (pick an existing tag like v0.2.5)
# Assets (GitHub sorts alphabetically; sort key sits after the tag version):
#   name_X.Y.Z_01-android-arm64 → _01-android-universal → _02-windows →
#   _03-macos → _04-linux-deb → _05-linux-rpm → _06-linux-appimage
# RPM bundles arrive as name-version-release.arch.rpm (hyphens); order-assets
# rewrites them to the underscore scheme so they sit with .deb, not at the top.
# Version in filenames comes from the release tag (e.g. v0.2.5 → 0.2.5), not package.json.

name: Release

# Actions list title: prefer release title (often "vX.Y.Z: …"); fall back to tag.
run-name: ${{ github.event.release.name || github.event.inputs.tag || github.workflow }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.2.5)
        required: true
        type: string

concurrency:
  # Use github.ref only — never `inputs` / `github.event.inputs` here.
  # Referencing the inputs context on `release` events can prevent the workflow
  # from starting at all (no run appears in Actions).
  # release published → github.ref is refs/tags/vX.Y.Z
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Resolve tag + release id for both `release` and manual `workflow_dispatch`.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - name: Resolve release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID_FROM_EVENT: ${{ github.event.release.id }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            RELEASE_ID="$RELEASE_ID_FROM_EVENT"
          else
            TAG="${DISPATCH_TAG#"${DISPATCH_TAG%%[![:space:]]*}"}"
            TAG="${TAG%"${TAG##*[![:space:]]}"}"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires inputs.tag"
              exit 1
            fi
            RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag must look like vX.Y.Z (got tag=${TAG}, version=${VERSION})"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "release_id=${RELEASE_ID}"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${TAG} version=${VERSION} release_id=${RELEASE_ID}"

  build-tauri:
    needs: meta
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # --split-per-abi is required: without it, --target aarch64 still
          # produces a *universal*-named APK and overwrites the other Android asset.
          - platform: ubuntu-22.04
            args: --apk --split-per-abi --target aarch64
            mobile: android
            asset_pattern: '[name]_[version]_01-android-arm64[ext]'
            rust_targets: aarch64-linux-android,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: --apk
            mobile: android
            asset_pattern: '[name]_[version]_01-android-universal[ext]'
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
          - platform: windows-latest
            args: ''
            mobile: ''
            asset_pattern: '[name]_[version]_02-windows_[arch][setup][ext]'
            rust_targets: wasm32-unknown-unknown
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            mobile: ''
            asset_pattern: '[name]_[version]_03-macos_[arch][ext]'
            rust_targets: aarch64-apple-darwin,wasm32-unknown-unknown
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            mobile: ''
            asset_pattern: '[name]_[version]_03-macos_[arch][ext]'
            rust_targets: x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ''
            mobile: ''
            # Linux: order-assets inserts _04/_05/_06 after the version.
            asset_pattern: ''
            rust_targets: wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      # Private submodule crates/core → MohsenDastaran/social-wrapped-core
      # GITHUB_TOKEN cannot read other private repos. Create a fine-grained PAT
      # (Contents: Read on social-wrapped-core) and add it as secret SUBMODULE_TOKEN
      # on the social-wrapped repo: Settings → Secrets and variables → Actions.
      - name: Require submodule token
        shell: bash
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::error::Missing secret SUBMODULE_TOKEN on social-wrapped (not on social-wrapped-core). Add a fine-grained PAT with Contents: Read on MohsenDastaran/social-wrapped-core."
            exit 1
          fi

      # Clone public app with GITHUB_TOKEN; private submodule needs the PAT separately.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
          submodules: false

      - name: Checkout private app-core submodule
        shell: bash
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android platform / build-tools
        if: matrix.mobile == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "Using ANDROID_KEY_* secrets for release signing."
          else
            echo "keyAlias=upload" > keystore.properties
            echo "password=social-wrapped-release" >> keystore.properties
            echo "storeFile=$PWD/ci-release.jks" >> keystore.properties
            echo "Using committed ci-release.jks for sideload signing."
          fi

      - name: Install wasm-pack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-pack

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.mobile || 'desktop' }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri-action's [version] comes from tauri.conf.json / package.json.
      # Overwrite those (and Cargo workspace version) from the release tag.
      - name: Sync version from release tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Using release version: $VERSION"
          cat > "$RUNNER_TEMP/sync-release-version.js" <<'BUN'
          const fs = require("fs")
          const version = process.env.VERSION
          if (!version) throw new Error("VERSION env is empty")

          const pkgPath = "package.json"
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n")

          const tauriPath = "src-tauri/tauri.conf.json"
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"))
          tauri.version = version
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n")

          const cargoPath = "Cargo.toml"
          const cargo = fs.readFileSync(cargoPath, "utf8")
          const next = cargo.replace(
            /(\[workspace\.package\][\s\S]*?^version\s*=\s*")[^"]+(")/m,
            `$1${version}$2`
          )
          if (next === cargo) {
            throw new Error("Could not update [workspace.package] version in Cargo.toml")
          }
          fs.writeFileSync(cargoPath, next)
          console.log(`Synced package.json, tauri.conf.json, Cargo.toml → ${version}`)
          BUN
          bun "$RUNNER_TEMP/sync-release-version.js"

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          releaseId: ${{ needs.meta.outputs.release_id }}
          tagName: ${{ needs.meta.outputs.tag }}
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          tauriScript: bun tauri

  # Rename Linux bundles (and any leftovers) so the sort key sits after the version.
  # Still run when some matrix builds fail (e.g. a flaky macOS runner) so
  # successful uploads (deb/rpm/AppImage) get their _04/_05/_06 keys.
  order-assets:
    needs: [meta, build-tauri]
    if: ${{ always() && !cancelled() && needs.meta.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Normalize asset names for display order
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.meta.outputs.release_id }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/order-release-assets.js" <<'BUN'
          const token = process.env.GITHUB_TOKEN
          const releaseId = process.env.RELEASE_ID
          const version = process.env.VERSION
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/")

          async function gh(path, { method = "GET", body } = {}) {
            const res = await fetch(`https://api.github.com${path}`, {
              method,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(body ? { "Content-Type": "application/json" } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            })
            if (!res.ok) {
              throw new Error(
                `${method} ${path} → ${res.status} ${await res.text()}`
              )
            }
            return res.status === 204 ? null : res.json()
          }

          const assets = await gh(
            `/repos/${owner}/${repo}/releases/${releaseId}/assets?per_page=100`
          )

          const SORT_AFTER_VERSION =
            /_\d{2}-(?:android|windows|macos|linux)(?:[-_]|$)/i

          function sortKeyFor(name) {
            const bare = name.replace(/\.sig$/i, "").toLowerCase()
            if (bare.endsWith(".apk") || bare.endsWith(".aab")) {
              return bare.includes("arm64") || bare.includes("aarch64")
                ? "01-android-arm64"
                : "01-android-universal"
            }
            if (bare.endsWith(".msi") || bare.endsWith(".exe")) {
              return "02-windows"
            }
            if (
              bare.endsWith(".dmg") ||
              bare.endsWith(".app") ||
              bare.includes(".app.tar")
            ) {
              return "03-macos"
            }
            if (bare.endsWith(".deb")) return "04-linux-deb"
            if (bare.endsWith(".rpm")) return "05-linux-rpm"
            if (bare.endsWith(".appimage")) return "06-linux-appimage"
            return "99-other"
          }

          function stripLegacyLeadingPrefix(name) {
            return name.replace(/^\d{2}[a-z]?-/, "")
          }

          function insertSortKeyAfterVersion(name, sortKey) {
            if (SORT_AFTER_VERSION.test(name)) return name

            if (version) {
              const needle = `_${version}_`
              const idx = name.indexOf(needle)
              if (idx !== -1) {
                const after = name.slice(idx + needle.length)
                const cleaned = after.replace(/^\d{2}[a-z]?[-_]/, "")
                return (
                  name.slice(0, idx + needle.length) +
                  sortKey +
                  (cleaned ? `_${cleaned}` : "")
                )
              }
              const dotted = `_${version}.`
              const dIdx = name.indexOf(dotted)
              if (dIdx !== -1) {
                return (
                  name.slice(0, dIdx + 1 + version.length) +
                  `_${sortKey}` +
                  name.slice(dIdx + 1 + version.length)
                )
              }
            }

            const m = name.match(
              /^(.*?_)(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]*)?)(_|\.|$)(.*)$/
            )
            if (!m) return `${name.replace(/(\.[^.]+)$/, `_${sortKey}$1`)}`
            const [, prefix, ver, sep, rest] = m
            if (sep === "_") {
              const cleaned = rest.replace(/^\d{2}[a-z]?[-_]/, "")
              return `${prefix}${ver}_${sortKey}${cleaned ? `_${cleaned}` : ""}`
            }
            return `${prefix}${ver}_${sortKey}${sep}${rest}`
          }

          function normalizeHyphenatedRpm(name) {
            const sig = /\.sig$/i.test(name) ? ".sig" : ""
            const core = name.replace(/\.sig$/i, "")
            if (!/\.rpm$/i.test(core)) return null

            const escaped = version.replace(/\./g, "\\.")
            const m = core.match(
              new RegExp(
                `^(.*?)-${escaped}-(\\d+)\\.(.+?)(?:_\\d{2}-linux-rpm)?\\.rpm$`,
                "i"
              )
            )
            if (!m) return null
            const pkg = m[1]
            const arch = m[3]
            return `${pkg}_${version}_05-linux-rpm_${arch}.rpm${sig}`
          }

          function desiredName(name) {
            const stripped = stripLegacyLeadingPrefix(name)
            return (
              normalizeHyphenatedRpm(stripped) ??
              insertSortKeyAfterVersion(stripped, sortKeyFor(stripped))
            )
          }

          for (const asset of assets) {
            const next = desiredName(asset.name)
            if (next === asset.name) continue
            console.log(`${asset.name} → ${next}`)
            await gh(`/repos/${owner}/${repo}/releases/assets/${asset.id}`, {
              method: "PATCH",
              body: { name: next },
            })
          }
          BUN
          bun "$RUNNER_TEMP/order-release-assets.js"
