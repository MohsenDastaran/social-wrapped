# Build installers and attach them to the GitHub Release.
#
# Trigger:
#   - Publish a GitHub Release (release published), or
#   - Actions → Release → Run workflow (pick an existing tag like v0.2.5)
# Assets (sorted alphabetically via numeric prefixes):
#   01a arm64-v8a APK → 01b universal APK → 02 Windows → 03 macOS → 04 deb → 05 rpm → 06 AppImage

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.2.5)
        required: true
        type: string

concurrency:
  # Use github.ref only — never `inputs` / `github.event.inputs` here.
  # Referencing the inputs context on `release` events can prevent the workflow
  # from starting at all (no run appears in Actions).
  # release published → github.ref is refs/tags/vX.Y.Z
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Resolve tag + release id for both `release` and manual `workflow_dispatch`.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - name: Resolve release
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName
            let tag = ''
            let releaseId = ''

            if (event === 'release') {
              tag = context.payload.release.tag_name
              releaseId = String(context.payload.release.id)
            } else {
              tag = (context.payload.inputs?.tag || '').trim()
              if (!tag) throw new Error('workflow_dispatch requires inputs.tag')
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              releaseId = String(release.id)
            }

            core.info(`tag=${tag} release_id=${releaseId}`)
            core.setOutput('tag', tag)
            core.setOutput('release_id', releaseId)

  build-tauri:
    needs: meta
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # --split-per-abi is required: without it, --target aarch64 still
          # produces a *universal*-named APK and overwrites the other Android asset.
          - platform: ubuntu-22.04
            args: --apk --split-per-abi --target aarch64
            mobile: android
            asset_pattern: 01a-[name]_[version]_arm64-v8a[ext]
            rust_targets: aarch64-linux-android,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: --apk
            mobile: android
            asset_pattern: 01b-[name]_[version]_universal[ext]
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
          - platform: windows-latest
            args: ''
            mobile: ''
            asset_pattern: 02-[name]_[version]_[arch][setup][ext]
            rust_targets: wasm32-unknown-unknown
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            mobile: ''
            asset_pattern: 03-[name]_[version]_[arch][ext]
            rust_targets: aarch64-apple-darwin,wasm32-unknown-unknown
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            mobile: ''
            asset_pattern: 03-[name]_[version]_[arch][ext]
            rust_targets: x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ''
            mobile: ''
            # Linux: order-assets renames deb/rpm/AppImage to 04/05/06.
            asset_pattern: ''
            rust_targets: wasm32-unknown-unknown

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      # Private submodule crates/core → MohsenDastaran/social-wrapped-core
      # GITHUB_TOKEN cannot read other private repos. Create a fine-grained PAT
      # (Contents: Read on social-wrapped-core) and add it as secret SUBMODULE_TOKEN
      # on the social-wrapped repo: Settings → Secrets and variables → Actions.
      - name: Require submodule token
        shell: bash
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::error::Missing secret SUBMODULE_TOKEN on social-wrapped (not on social-wrapped-core). Add a fine-grained PAT with Contents: Read on MohsenDastaran/social-wrapped-core."
            exit 1
          fi

      # Clone public app with GITHUB_TOKEN; private submodule needs the PAT separately.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
          submodules: false

      - name: Checkout private app-core submodule
        shell: bash
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.mobile != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools
        if: matrix.mobile == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "Using ANDROID_KEY_* secrets for release signing."
          else
            echo "keyAlias=upload" > keystore.properties
            echo "password=social-wrapped-release" >> keystore.properties
            echo "storeFile=$PWD/ci-release.jks" >> keystore.properties
            echo "Using committed ci-release.jks for sideload signing."
          fi

      - name: Install wasm-pack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-pack

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.mobile || 'desktop' }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          releaseId: ${{ needs.meta.outputs.release_id }}
          tagName: ${{ needs.meta.outputs.tag }}
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}

  # Rename Linux bundles (and any leftovers) into the sort order.
  order-assets:
    needs: [meta, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Prefix / normalize asset names for display order
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.meta.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID)
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            })

            function desiredName(name) {
              // Already prefixed by releaseAssetNamePattern — leave alone.
              if (/^\d{2}[a-z]?-/.test(name)) return name

              const bare = name.replace(/\.sig$/i, '').toLowerCase()
              let prefix = '99'
              if (bare.endsWith('.apk') || bare.endsWith('.aab')) {
                prefix =
                  bare.includes('arm64') || bare.includes('aarch64')
                    ? '01a'
                    : '01b'
              } else if (bare.endsWith('.msi') || bare.endsWith('.exe')) {
                prefix = '02'
              } else if (
                bare.endsWith('.dmg') ||
                bare.endsWith('.app') ||
                bare.includes('.app.tar')
              ) {
                prefix = '03'
              } else if (bare.endsWith('.deb')) {
                prefix = '04'
              } else if (bare.endsWith('.rpm')) {
                prefix = '05'
              } else if (bare.endsWith('.appimage')) {
                prefix = '06'
              }
              return `${prefix}-${name}`
            }

            for (const asset of assets) {
              const next = desiredName(asset.name)
              if (next === asset.name) continue
              core.info(`${asset.name} → ${next}`)
              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                name: next,
              })
            }
